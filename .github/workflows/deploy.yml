name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# id-token is what lets azure/login use OIDC instead of a stored client secret.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Resource names, not secrets — inlined so the workflow has no repo-variable setup step.
# Move them to `vars.*` only if you need different values per environment.
env:
  ACR_NAME: acritronekg
  APP_NAME: ca-itron-ekg
  RESOURCE_GROUP: rg-itron-ekg-search

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuses the OIDC secrets created by the portal's continuous-deployment setup.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAITRONEKG_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAITRONEKG_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAITRONEKG_AZURE_SUBSCRIPTION_ID }}

      # Built on the runner rather than with `az acr build`: ACR Tasks is not permitted on
      # this subscription (TasksOperationsNotAllowed), and that is a platform restriction no
      # role assignment changes. `az acr login` authenticates Docker as the OIDC identity,
      # so there is still no registry password involved.
      #
      # Tagging with the commit SHA keeps each deploy on a distinct digest -- reusing a tag
      # leaves the revision pinned to the cached image.
      - name: Build and push image
        run: |
          IMAGE=${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.sha }}
          az acr login --name ${{ env.ACR_NAME }}
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Container Apps
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.sha }}

      - name: Verify revision is healthy
        run: |
          FQDN=$(az containerapp show -n ${{ env.APP_NAME }} \
            -g ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/healthz" || true)
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            sleep 5
          done
          echo "new revision did not become healthy"
          az containerapp logs show -n ${{ env.APP_NAME }} -g ${{ env.RESOURCE_GROUP }} --tail 50
          exit 1
