name: Trigger auto deployment for ca-itron-ekg

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/ca-itron-ekg-AutoDeployTrigger-90c67d53-00cc-41a4-8b82-4d424bd5bc06.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAITRONEKG_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAITRONEKG_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAITRONEKG_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acritronekg.azurecr.io
          registryUsername: ${{ secrets.CAITRONEKG_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAITRONEKG_REGISTRY_PASSWORD }}
          containerAppName: ca-itron-ekg
          resourceGroup: rg-itron-ekg-search
          imageToBuild: acritronekg.azurecr.io/ca-itron-ekg:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


