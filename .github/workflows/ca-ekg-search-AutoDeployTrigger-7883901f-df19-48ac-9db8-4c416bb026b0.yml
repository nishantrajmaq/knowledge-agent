name: Trigger auto deployment for ca-ekg-search

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/ca-ekg-search-AutoDeployTrigger-7883901f-df19-48ac-9db8-4c416bb026b0.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAEKGSEARCH_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAEKGSEARCH_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAEKGSEARCH_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrekgseach.azurecr.io
          registryUsername: ${{ secrets.CAEKGSEARCH_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAEKGSEARCH_REGISTRY_PASSWORD }}
          containerAppName: ca-ekg-search
          resourceGroup: rg-ekg-agent-test
          imageToBuild: acrekgseach.azurecr.io/ca-ekg-search:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


